[project]
name = "pc-builder-backend"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.poe.tasks]
dev = "uvicorn app.main:app --reload --host 127.0.0.1 --port 8000"
test = "pytest"
coverage = "pytest --cov=app --cov-report=term-missing"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy app"

[tool.poe.tasks.check]
sequence = ["lint", "format-check", "typecheck", "test"]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]  # B008: FastAPI Depends() in argument defaults is standard; BLE01: DB trigger catches all exceptions

[tool.mypy]
strict_optional = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.api.*", "app.services.cart_service", "app.services.build_service", "app.services.social_service", "app.services.catalog", "app.api.deps", "app.api.auth"]
disable_error_code = ["arg-type", "attr-defined", "no-any-return", "return-value"]